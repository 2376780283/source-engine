name: Build All Games Android AArch64

on:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: 'Android NDK version'
        required: true
        default: 'r28c'
        type: string
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      build_games:
        description: 'Select game to build (select "all" for full matrix)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - entropyzero2
      android_api:
        description: 'Android API level'
        required: true
        default: '29'
        type: string

jobs:
  # 步骤 1：动态判断并生成需要构建的游戏矩阵
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.set-games.outputs.games }}
    steps:
      - id: set-games
        run: |
          SELECTED_GAME="${{ inputs.build_games }}"
          BRANCH="${{ github.ref_name }}"
          if [ -n "$SELECTED_GAME" ] && [ "$SELECTED_GAME" != "all" ]; then
            echo "Building single selected game: $SELECTED_GAME"
            GAMES_JSON=$(jq -nc --arg g "$SELECTED_GAME" '[$g]')
          else
            BASE_GAMES='["hl2", "hl1", "hl2mp", "cstrike", "episodic", "portal", “entropyzero2”]'
            if [ "$BRANCH" = "EntropyZero" ]; then
              echo "Branch is EntropyZero. Adding entropyzero2 to matrix..."
              GAMES_JSON=$(echo $BASE_GAMES | jq '. + ["entropyzero2"]')
            elif [ "$BRANCH" = "nh2" ]; then
              echo "Branch is nh2. Adding nh2 to matrix..."
              GAMES_JSON=$(echo $BASE_GAMES | jq '. + ["nh2"]')
            else
              GAMES_JSON=$BASE_GAMES
            fi
          fi

          echo "Final games matrix: $GAMES_JSON"
          echo "games=$GAMES_JSON" >> $GITHUB_OUTPUT
  build-android:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJson(needs.prepare-matrix.outputs.games) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Android NDK
        uses: actions/cache@v4
        id: ndk-cache
        with:
          path: android-ndk-${{ inputs.ndk_version || 'r28c' }}
          key: android-ndk-${{ inputs.ndk_version || 'r28c' }}-${{ runner.os }}

      - name: Download Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          NDK_VER="${{ inputs.ndk_version || 'r28c' }}"
          echo "Downloading Android NDK $NDK_VER..."
          curl -sSLf "https://dl.google.com/android/repository/android-ndk-$NDK_VER-linux.zip" -o ndk.zip
          echo "Extracting NDK..."
          unzip -q ndk.zip
          rm ndk.zip
          echo "NDK ready."

      - name: Configure, Build & Install
        env:
          ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk-${{ inputs.ndk_version || 'r28c' }}
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
          ANDROID_API: ${{ inputs.android_api || '29' }}
          CURRENT_GAME: ${{ matrix.game }}
        run: |
          echo "========================================"
          echo "Building Game: $CURRENT_GAME"
          echo "NDK Path: $ANDROID_NDK_HOME"
          echo "Build Type: $BUILD_TYPE"
          echo "Android API: $ANDROID_API"
          echo "========================================"
          INSTALL_DIR="${{ github.workspace }}/android_build_$CURRENT_GAME"

          python3 ./waf configure \
            -T "$BUILD_TYPE" \
            --prefix="$INSTALL_DIR" \
            --android=aarch64,llvm,"$ANDROID_API" \
            --target=android_build \
            --disable-warns \
            --togles \
            --build-games="$CURRENT_GAME"

          echo "========================================"
          echo "Starting build and install for $CURRENT_GAME..."
          echo "========================================"

          python3 ./waf build install
          # do not add the fucking strip

      - name: Verify & List Output Artifacts
        run: |
          INSTALL_DIR="${{ github.workspace }}/android_build_${{ matrix.game }}"
          echo "=== Artifacts for ${{ matrix.game }} ==="
          ls -la "$INSTALL_DIR"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aarch64-${{ matrix.game }}-${{ inputs.build_type || 'release' }}
          path: ${{ github.workspace }}/android_build_${{ matrix.game }}/
          if-no-files-found: error
