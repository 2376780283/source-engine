name: Build Android AArch64

on:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: 'Android NDK version'
        required: true
        default: 'r28c'
        type: string
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      build_games:
        description: 'Games to build (--build-games)'
        required: true
        default: 'entropyzero2'
        type: string
      android_api:
        description: 'Android API level'
        required: true
        default: '29'
        type: string

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Android NDK
        uses: actions/cache@v4
        id: ndk-cache
        with:
          path: android-ndk-${{ inputs.ndk_version }}
          key: android-ndk-${{ inputs.ndk_version }}-${{ runner.os }}

      - name: Download Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          NDK_VERSION="${{ inputs.ndk_version }}"
          echo "Downloading Android NDK $NDK_VERSION..."
          curl -sSLf "https://dl.google.com/android/repository/android-ndk-$NDK_VERSION-linux.zip" -o ndk.zip
          echo "Extracting NDK..."
          unzip -q ndk.zip
          rm ndk.zip
          echo "NDK downloaded and extracted successfully"
          ls -la android-ndk-$NDK_VERSION/

      - name: Configure & Build
        env:
          ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk-${{ inputs.ndk_version }}
        run: |
          echo "========================================"
          echo "NDK Path: $ANDROID_NDK_HOME"
          echo "Build Type: ${{ inputs.build_type }}"
          echo "Games: ${{ inputs.build_games }}"
          echo "Android API: ${{ inputs.android_api }}"
          echo "========================================"
          python3 ./waf configure \
            -T ${{ inputs.build_type }} \
            --prefix=${{ github.workspace }}/android_build \
            --android=aarch64,llvm,${{ inputs.android_api }} \
            --target=android_build \
            --disable-warns \
            --togles \
            --build-games=${{ inputs.build_games }}
          python3 ./waf install #do not add prefix strip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-aarch64-${{ inputs.build_games }}-${{ inputs.build_type }}
          path: ${{ github.workspace }}/android_build/
          if-no-files-found: error
